<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Team #10 — Control Room</title><link rel="stylesheet" href="{{ url_for('static',filename='css/style.css') }}"></head><body><header class="nav"><a class="brand" href="/"><span class="brand-dot">10</span><span>CONTROL ROOM</span></a><a class="nav-cta" href="/admin/logout">LOG OUT ↗</a></header><main class="section" style="padding-top:140px"><div class="section-top"><div><span class="eyebrow">LIVE CONTROL ROOM</span><h2>THE<br><em>HYPE DATA.</em></h2></div><span class="nav-cta">● LIVE</span></div><div class="admin-stats"><div><span>TOTAL REVIEWS</span><b id="total">0</b></div><div><span>AVERAGE RATING</span><b id="avg">—</b></div><div><span>5★ REVIEWS</span><b id="five">0</b></div><div><span>GAME PLAYS</span><b id="gamePlays">0</b></div><div><span>10% WINNERS</span><b id="gameWins">0</b></div></div><div class="admin-panels"><section class="glass"><h3>PRODUCT SCOREBOARD</h3><div id="products"></div></section><section class="glass"><h3>RATING DISTRIBUTION</h3><div class="distribution" id="dist"></div></section></div><section class="glass" style="margin-top:15px"><div class="admin-head"><h3>GAME WINNERS</h3></div><div id="winners" class="winners-list"><div class="admin-line"><span>No winners yet.</span><b>1% CHANCE</b></div></div></section><section class="glass" style="margin-top:15px"><div class="admin-head"><h3>ALL REVIEWS</h3><input id="search" placeholder="Search name / comment…"></div><div class="table-wrap"><table><thead><tr><th>Student</th><th>Product</th><th>Rating</th><th>Comment</th><th>Date</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>
let reviews=[];const $=id=>document.getElementById(id);
async function load(){const [r,s,g]=await Promise.all([fetch("/api/reviews"),fetch("/api/statistics"),fetch("/api/game/stats")]);reviews=await r.json();let x=await s.json();let game=await g.json();$("total").textContent=x.total;$("avg").textContent=x.total?x.average:"—";$("five").textContent=x.distribution[5];$("products").innerHTML=Object.entries(x.products).map(([n,v])=>`<div class="admin-line"><span>${n}</span><b>${v.average||"—"} ★ · ${v.count} reviews</b></div>`).join("");$("dist").innerHTML=[5,4,3,2,1].map(i=>`<div><span>${i}</span><i><b style="width:${x.total?x.distribution[i]/x.total*100:0}%"></b></i><span>${x.distribution[i]}</span></div>`).join("");$("gamePlays").textContent=game.plays;$("gameWins").textContent=game.wins;$("winners").innerHTML=game.winners.length?game.winners.map(w=>`<div class="admin-line"><span>🎟️ ${safe(w.code)}<small>${safe(w.created_at)}</small></span><b>10% OFF</b></div>`).join(""):'<div class="admin-line"><span>No winners yet.</span><b>1% CHANCE</b></div>';render()}
function render(){let q=$("search").value.toLowerCase();$("rows").innerHTML=reviews.filter(r=>(r.name+" "+r.comment+" "+r.product).toLowerCase().includes(q)).map(r=>`<tr><td><strong>${safe(r.name)}</strong><small>${safe(r.contact||"")}</small></td><td>${safe(r.product)}</td><td class="redtext">${"★".repeat(r.rating)}${"☆".repeat(5-r.rating)}</td><td>${safe(r.comment)}</td><td>${safe(r.created_at)}</td><td><button class="delete" onclick="del(${r.id})">DELETE</button></td></tr>`).join("")||'<tr><td colspan="6">No matching reviews.</td></tr>'}
function safe(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
$("search").addEventListener("input",render);
async function del(id){if(!confirm("Delete this review?"))return;await fetch("/admin/delete/"+id,{method:"POST"});load()}
load();
</script><style>.admin-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.admin-stats>div{border:1px solid #292929;border-radius:20px;padding:25px;background:#111}.admin-stats span{display:block;color:#666;font-size:9px;letter-spacing:1px}.admin-stats b{display:block;font:700 38px 'Space Grotesk';margin-top:10px}.admin-panels{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.glass h3{font:700 15px 'Space Grotesk';margin:0 0 20px}.admin-line{display:flex;justify-content:space-between;padding:15px 0;border-bottom:1px solid #272727;font-size:11px}.admin-line b{color:#e50914}.admin-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.admin-head input{width:280px;margin:0}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:10px}th{text-align:left;color:#555;padding:11px;border-bottom:1px solid #292929;font-size:8px;letter-spacing:1px}td{padding:14px 11px;border-bottom:1px solid #202020;color:#aaa;vertical-align:top}td strong{display:block;color:#eee}.redtext{color:#e50914}.delete{background:#17090b;color:#ff9298;border:1px solid #542126;border-radius:8px;padding:7px;font-size:8px;cursor:pointer}@media(max-width:700px){.admin-stats,.admin-panels{grid-template-columns:1fr}.admin-head{display:block}.admin-head input{width:100%}}</style></body></html>
